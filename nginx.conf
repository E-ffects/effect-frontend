server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API는 같은 주소로 받아 백엔드 컨테이너로 넘긴다 (브라우저는 프론트 포트 하나만 알면 된다)
    location /api/ {
        # 백엔드 주소를 요청마다 Docker DNS로 찾는다: 백엔드가 꺼져 있으면 기다리지 않고 바로 502
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s; # AI 보고서 생성 대기
        # 백엔드가 꺼졌거나 응답이 없을 때: nginx 영어 HTML 대신 화면이 읽을 수 있는 JSON
        # (백엔드가 직접 보낸 503 "AI 일시 불가" 등은 그대로 통과한다)
        error_page 502 504 = @api_down;
    }

    location @api_down {
        default_type application/json;
        charset utf-8;
        return 502 '{"detail":"서버에 연결할 수 없습니다. 잠시 후 다시 시도하세요"}';
    }

    # 빌드 파일은 이름에 해시가 붙어 오래 캐시해도 된다
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router(history 모드): 없는 경로는 index.html로
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
