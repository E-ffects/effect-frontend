name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: harbor.skala-us.com/u1-2/frontend
  ARGOCD_APP: u1-2-backend
  ARGOCD_SERVER: argocd.skala-us.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: harbor.skala-us.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/checkout@v4
        with:
          repository: E-ffects/effect-deployment
          token: ${{ secrets.DEPLOYMENT_REPO_TOKEN }}
          path: deployment

      # 백엔드 배포와 겹쳐 push가 거절되면 최신 main 위에 다시 올린다
      - name: Update image tag
        working-directory: deployment/k8s
        run: |
          kustomize edit set image ${{ env.IMAGE }}=${{ env.IMAGE }}:${{ github.sha }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet && exit 0
          git commit -am "deploy: frontend ${GITHUB_SHA::7}"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1

      - name: Sync ArgoCD
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_CI_TOKEN }}
        run: |
          curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/download/v2.14.11/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd
          argocd app sync ${{ env.ARGOCD_APP }} --server ${{ env.ARGOCD_SERVER }} --grpc-web
          argocd app wait ${{ env.ARGOCD_APP }} --server ${{ env.ARGOCD_SERVER }} --grpc-web --health --timeout 300
